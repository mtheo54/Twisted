<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABRASION Skin Studio</title>
<meta name="description" content="Créer des skins pour RAW 2 : fonds image, vidéo ou générés, couleurs, verre dépoli et placement des blocs. Gratuit, hors ligne.">
<style>
@font-face{font-family:"JBM";src:url(__FONT_MONO__) format("woff2");font-weight:400}
@font-face{font-family:"JBM";src:url(__FONT_MONOB__) format("woff2");font-weight:700}
@font-face{font-family:"Pix";src:url(__FONT_PIXEL__) format("woff2")}
:root{
  --bg:#0E0E10;--dot:#232327;--panel:#17171A;--panel2:#1F1F23;--line:#2E2E34;--rule:#3A3A41;
  --ink:#F0F0F0;--muted:#86868D;--acc:#FF4D00;--onacc:#0D0D0D;--scr:#070708;--ok:#3CDC8C;--warn:#FFB000;
}
:root[data-theme="light"]{
  --bg:#DCDCD6;--dot:#C4C4BE;--panel:#F4F4F0;--panel2:#ECECE7;--line:#1A1A1A;--rule:#0D0D0D;
  --ink:#0D0D0D;--muted:#6F6F6A;--scr:#0D0D0D;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#DCDCD6;--dot:#C4C4BE;--panel:#F4F4F0;--panel2:#ECECE7;--line:#1A1A1A;--rule:#0D0D0D;
  --ink:#0D0D0D;--muted:#6F6F6A;--scr:#0D0D0D;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:12px/1.45 "JBM",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em;
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:16px 16px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
.logo{width:38px;height:38px;background:var(--ink);display:grid;place-items:center;flex:none}
.logo i{width:14px;height:14px;background:var(--acc);display:block}
.brand{display:flex;flex-direction:column;line-height:1}
.brand small{font-size:9px;letter-spacing:.35em;color:var(--muted)}
.brand b{font:22px "Pix",monospace;letter-spacing:.08em;margin-top:4px}
.brand b em{font-style:normal;color:var(--acc)}
.tag{border:1px solid var(--line);padding:3px 8px;font-size:10px;letter-spacing:.18em;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.btn{background:var(--panel);border:1px solid var(--rule);padding:8px 12px;cursor:pointer;letter-spacing:.12em;text-transform:uppercase;font-size:11px;
  box-shadow:2px 2px 0 var(--rule);transition:transform .05s;white-space:nowrap;border-radius:2px}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.acc{background:var(--acc);color:#0D0D0D;border-color:#0D0D0D;box-shadow:2px 2px 0 #0D0D0D;font-weight:700}
.btn.on{background:var(--ink);color:var(--panel)}
.btn.sm{padding:5px 8px;font-size:10px;box-shadow:1px 1px 0 var(--rule)}
.btn:disabled{opacity:.4;cursor:default}
.app{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;padding:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);position:relative;border-radius:2px}
.card::before,.card::after{content:"+";position:absolute;color:var(--muted);font-size:12px;line-height:1}
.card::before{top:5px;left:7px}.card::after{bottom:5px;right:7px}
.card>summary,.card>.hd{list-style:none;cursor:pointer;padding:14px 16px 12px 24px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid transparent}
.card[open]>summary{border-bottom-color:var(--line)}
.card>summary::-webkit-details-marker{display:none}
.hd .n,summary .n{color:var(--acc);font-size:10px;letter-spacing:.2em}
.hd h2,summary h2{font:15px "Pix",monospace;letter-spacing:.1em;margin:0;text-transform:uppercase}
summary .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.card[open] summary .chev{transform:rotate(90deg)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row>label,.lbl{width:92px;flex:none;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.row input[type=text]{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);padding:7px 9px;border-radius:2px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.row output{width:44px;text-align:right;font-size:11px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sw{border:1px solid var(--line);padding:6px;cursor:pointer;display:flex;gap:8px;align-items:center;background:var(--panel2);font-size:10px;letter-spacing:.12em;border-radius:2px}
.sw i{width:18px;height:18px;border:1px solid #0D0D0D;display:grid;place-items:center;flex:none}
.sw i b{width:7px;height:7px;display:block}
.sw.on{outline:2px solid var(--ink);outline-offset:1px}
.color{display:flex;align-items:center;gap:8px;min-width:0}
.color input[type=color]{width:34px;height:26px;border:1px solid var(--line);padding:0;background:none;cursor:pointer;flex:none}
.color .hex{flex:1;min-width:0;font-size:11px;color:var(--muted)}
.hue{height:16px;flex:1;border:1px solid var(--rule);cursor:ew-resize;position:relative;border-radius:2px;
  background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.hue b{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--ink);border:1px solid var(--panel)}
.drop{border:1px dashed var(--muted);padding:16px;text-align:center;color:var(--muted);cursor:pointer;font-size:11px;letter-spacing:.08em;border-radius:2px}
.drop.over{border-color:var(--acc);color:var(--ink);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.info{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.info.warn{color:var(--warn)}
.info.err{color:#FF5A4F}
.adv{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.adv .color label{width:96px;flex:none;font-size:10px;color:var(--muted)}
.adv input[type=range]{width:60px}
.stage{min-width:0;display:flex;flex-direction:column;gap:10px;position:sticky;top:84px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs .btn{padding:7px 10px}
.view{position:relative;background:var(--scr);border:1px solid var(--line);padding:10px;border-radius:2px}
canvas#pv{width:100%;height:auto;display:block;aspect-ratio:4/3;touch-action:none;cursor:default}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:10.5px}
.blist{display:flex;flex-direction:column;gap:6px}
.bl.off{opacity:.55}
.bl{display:grid;grid-template-columns:minmax(0,1fr) 50px 50px 48px 26px 26px;gap:6px;align-items:center;padding:5px 6px;border:1px solid var(--line);background:var(--panel2);border-radius:2px;cursor:pointer}
.bl.sel{border-color:var(--acc)}
.bl.bad{border-color:#FF5A4F}
.bl span{font-size:10.5px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl input{width:100%;background:var(--panel);border:1px solid var(--line);padding:3px 5px;font-size:11px;border-radius:2px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;font-size:12px;letter-spacing:.06em;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;border-radius:2px}
.toast.show{opacity:1}
.prog{height:4px;background:var(--panel2);border:1px solid var(--line)}
.prog b{display:block;height:100%;background:var(--acc);width:0}
footer{padding:18px;color:var(--muted);font-size:10.5px;letter-spacing:.12em;text-align:center}
footer b{color:var(--ink)}
.howto{font-size:11px;color:var(--muted);line-height:1.6}
.howto b{color:var(--ink);font-weight:400}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .stage{position:static;order:-1}
  .top{flex-wrap:wrap}
  .tag{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo" aria-hidden="true"><i></i></div>
  <div class="brand"><small>ABRASION</small><b>SKIN <em>STUDIO</em></b></div>
  <span class="tag">POUR RAW 2 · GRATUIT · HORS LIGNE</span>
  <span class="spacer"></span>
  <button class="btn" id="bNew" title="Repartir de zéro">Nouveau</button>
  <button class="btn" id="bOpen" title="Ouvrir un .raw2skin pour le modifier">Ouvrir</button>
  <button class="btn acc" id="bExport">Exporter .raw2skin</button>
  <input type="file" id="fOpen" accept=".raw2skin,.zip" hidden>
</header>

<main class="app">
  <aside class="side" id="side"></aside>
  <section class="stage">
    <div class="tabs" id="tabs"></div>
    <div class="view"><canvas id="pv" width="1280" height="960" aria-label="Aperçu de RAW 2 avec le skin"></canvas></div>
    <div class="bar">
      <button class="btn sm on" id="tOutline">Contours</button>
      <button class="btn sm on" id="tSnap">Aimant 8 px</button>
      <button class="btn sm" id="tResetPage">Réinitialiser la page</button>
      <b id="vis" class="hint" style="font-weight:700"></b>
    </div>
    <div class="bar" id="tray" hidden aria-label="Blocs retirés de cette page"></div>
    <div class="bar">
      <span class="hint">glisse un bloc pour le déplacer · son coin ◢ pour le rapetisser · ✕ pour le retirer · flèches, + et −, Suppr</span>
    </div>
  </section>
</main>
<footer>ABRASION SKIN STUDIO · v<span id="ver"></span> · glisse le <b>.raw2skin</b> sur RAW 2 pour l'installer · gratuit, rien n'est envoyé sur internet</footer>
<div class="toast" id="toast"></div>

<script>
"use strict";
const DATA = /*__DATA__*/null;
const W = 1280, H = 960, SPR = 0.75;
const TABS = [[0,"SON"],[7,"JEU"],[8,"SYNTH"],[1,"VIE"],[2,"MODULES"],[3,"ENV / LFO"],[4,"EFX"],[5,"MIX IA"],[6,"WAVETABLE"]];
const ACC_GROUP = ["acc","hl","ledTab","ptr","waveB","barPk","tagAcc"];
const TOKEN_LABELS = {chassis:"châssis",chDot:"points du châssis",card:"cartes",line:"bord des cartes",rule:"filets",ink:"texte",muted:"texte discret",
  scr:"écrans",scrLine:"bord des écrans",scrGrid:"grille des écrans",scrMid:"axe des écrans",scrText:"texte des écrans",scrMuted:"texte discret écrans",
  scrRule:"filets des écrans",acc:"accent",onAcc:"texte sur accent",hl:"surlignage",ledTab:"led des onglets",ptr:"repère des potards",tabBg:"onglet actif",
  tabFg:"texte onglet actif",logoBg:"fond du logo",btnBg:"boutons",btnEdge:"bord des boutons",waveA:"onde A",waveB:"onde B",barHi:"barres hautes",
  barLo:"barres basses",barPk:"crêtes",tickOff:"graduations",knobFace:"face des potards",knobLine:"trait des potards",lifeBg:"fond de la vie",
  lifeLine:"bord de la vie",dead:"cellules mortes",railBg:"rail",keyNat:"touches blanches",keyNatLine:"bord des touches",keySharp:"touches noires",
  crs:"repères d'angle",sw:"pastille du thème",inputBg:"champs",div:"séparateurs",old:"cellules âgées"};
const BASES = ["alu","nothing","titane","crt","ultraviolet","onirique"];
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

// ---------------------------------------------------------------------------------- couleurs
function parseCss(s){
  if (Array.isArray(s)) return {r:s[0],g:s[1],b:s[2],a:1};
  s = String(s||"").replace(/\s+/g,"");
  let m;
  if ((m = /^#([0-9a-f]{3})$/i.exec(s))) return {r:parseInt(m[1][0]+m[1][0],16),g:parseInt(m[1][1]+m[1][1],16),b:parseInt(m[1][2]+m[1][2],16),a:1};
  if ((m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(s))) return {r:parseInt(m[1].slice(0,2),16),g:parseInt(m[1].slice(2,4),16),b:parseInt(m[1].slice(4,6),16),a:m[2]?parseInt(m[2],16)/255:1};
  if ((m = /^rgba?\(([\d.]+),([\d.]+),([\d.]+)(?:,([\d.]+))?\)$/i.exec(s))) return {r:+m[1],g:+m[2],b:+m[3],a:m[4]!==undefined?+m[4]:1};
  return null;
}
const hx2 = v => Math.round(clamp(v,0,255)).toString(16).padStart(2,"0").toUpperCase();
function toHex(c){ return "#"+hx2(c.r)+hx2(c.g)+hx2(c.b)+(c.a<0.999?hx2(c.a*255):""); }
const rgba = c => `rgba(${c.r|0},${c.g|0},${c.b|0},${c.a})`;
function hsvHex(h){ const f=(n)=>{const k=(n+h*6)%6;return 255*(1-Math.max(0,Math.min(k,4-k,1)));}; return "#"+hx2(f(5))+hx2(f(3))+hx2(f(1)); }
function hueOf(c){ const r=c.r/255,g=c.g/255,b=c.b/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; if(d<1e-6)return 0;
  let h = mx===r?(g-b)/d:mx===g?2+(b-r)/d:4+(r-g)/d; h/=6; return h<0?h+1:h; }
const lum = c => (0.2126*c.r+0.7152*c.g+0.0722*c.b)/255;

// ---------------------------------------------------------------------------------- état
const DEF = () => ({
  name:"Mon skin", author:"", base:"nothing", colors:{},
  bg:{kind:"gen", voile:0.30, grille:false,
      gen:{style:"liquide", c1:"#FF4D00", c2:"#3A0F6B", c3:"#0A0A10", scale:0.5, speed:0.5, seed:7, anim:true, dur:6}},
  glass:{on:true, flou:0.65, teinte:0.40, reflet:0.65}, cards:0.85, layout:{}, hidden:[]
});
function fresh(){ const s = DEF(); const keep = S; S = s; setAccent("#FF4D00"); S.colors.scr = "#050508A0"; const r = S; S = keep; return r; }
let S = DEF();
let file = null;           // fond importé : {name, type, bytes, url, el (img|video), w, h}
let tab = 0, modSide = 0, sel = null, outline = true, snap = true;
const theme = () => {
  const t = {};
  const src = DATA.themes[S.base] || DATA.themes.nothing;
  for (const k in src) { const c = parseCss(src[k]); if (c) t[k] = c; }
  for (const k in S.colors) { const c = parseCss(S.colors[k]); if (c) t[k] = c; }
  if (!t.card) t.card = {r:30,g:30,b:30,a:1};
  return t;
};
const baseAccent = () => parseCss((DATA.themes[S.base]||{}).acc) || {r:255,g:77,b:0,a:1};
function accent(){ return parseCss(S.colors.acc || DATA.themes[S.base].acc); }
function setAccent(hex){
  const c = parseCss(hex); if (!c) return;
  for (const k of ACC_GROUP) S.colors[k] = toHex({...c,a:1});
  S.colors.onAcc = lum(c) > 0.55 ? "#0D0D0D" : "#FFFFFF";
}
const blocksOf = t => DATA.blocks.filter(b => b.tab === t && (t !== 2 || (modSide === 1) === (b.key === "mod.rack")));
// place d'un bloc : coin haut gauche et échelle (RAW 2 dessine le bloc rapetissé ou agrandi)
const SMIN = 0.5, SMAX = 1.6;
// Comme des widgets : chaque bloc change de taille à sa façon (même règles que RAW 2, Blocks.cpp).
// 0 échelle (proportions gardées) · 1 largeur seule (clavier) · 2 libre (OSC) · 3 colonnes / lignes (modules)
const RS = b => b.rs || 0;
const modCols = w => clamp(Math.floor(w / 260), 1, 3), modHeight = w => Math.ceil(3 / modCols(w)) * 56;
function fitSize(b, w, h){   // taille permise la plus proche
  const [mnW, mnH, mxW, mxH] = b.min || [b.r[2], b.r[3], b.r[2], b.r[3]];
  w = Math.round(clamp(w, mnW, Math.min(mxW, 1264)));
  if (RS(b) === 1) h = b.r[3];
  else if (RS(b) === 3) h = modHeight(w);
  else h = Math.round(clamp(h, mnH, Math.min(mxH, 876)));
  return {w, h};
}
const posOf = b => {
  const l = S.layout[b.key];
  if (RS(b)) { const o = l && !Array.isArray(l) ? l : null, f = fitSize(b, o ? o.w : b.r[2], o ? o.h : b.r[3]);
    return {x:o ? o.x : b.r[0], y:o ? o.y : b.r[1], s:1, w:f.w, h:f.h}; }
  const s = Array.isArray(l) ? (l[2] ?? 1) : 1;
  return Array.isArray(l) ? {x:l[0], y:l[1], s, w:b.r[2]*s, h:b.r[3]*s} : {x:b.r[0], y:b.r[1], s:1, w:b.r[2], h:b.r[3]};
};
const rectOf = (b, p = posOf(b)) => ({x:p.x, y:p.y, w:p.w, h:p.h});
const hits = (a, c) => a.x < c.x + c.w - 1 && c.x < a.x + a.w - 1 && a.y < c.y + c.h - 1 && c.y < a.y + a.h - 1;
const inside = r => r.x >= 8 - 0.5 && r.y >= 64 - 0.5 && r.x + r.w <= 1272.5 && r.y + r.h <= 940.5;
const isHidden = b => S.hidden.includes(b.key);
const shown = t => blocksOf(t).filter(b => !isHidden(b));   // blocs présents sur la page (les retirés ne comptent pas)
function overlapsAt(b, r){ return shown(b.tab).some(o => o !== b && hits(r, rectOf(o))); }
function overlaps(b){ return overlapsAt(b, rectOf(b)); }
const maxScale = (b, x, y) => Math.min(SMAX, (1272 - x)/b.r[2], (940 - y)/b.r[3]);
// sz : {s} pour un bloc à l'échelle, {w, h} pour un widget adaptatif
function setPos(b, x, y, sz){
  const p = posOf(b);
  if (RS(b)) {
    const f = fitSize(b, sz && sz.w !== undefined ? sz.w : p.w, sz && sz.h !== undefined ? sz.h : p.h);
    x = clamp(Math.round(x), 8, 1272 - f.w); y = clamp(Math.round(y), 64, Math.round(940 - f.h));
    const def = fitSize(b, b.r[2], b.r[3]);
    if (Math.abs(x - b.r[0]) < 0.5 && Math.abs(y - b.r[1]) < 0.5 && f.w === def.w && f.h === def.h) delete S.layout[b.key];
    else S.layout[b.key] = {x, y, w:f.w, h:f.h};
    return;
  }
  let s = clamp(sz && sz.s !== undefined ? sz.s : p.s, SMIN, Math.min(SMAX, 1264/b.r[2], 876/b.r[3])); s = Math.round(s*100)/100;
  x = clamp(Math.round(x), 8, Math.round(1272 - b.r[2]*s)); y = clamp(Math.round(y), 64, Math.round(940 - b.r[3]*s));
  if (Math.abs(x - b.r[0]) < 0.5 && Math.abs(y - b.r[1]) < 0.5 && Math.abs(s - 1) < 0.005) delete S.layout[b.key];
  else S.layout[b.key] = Math.abs(s - 1) < 0.005 ? [x, y] : [x, y, s];
}
// place libre la plus proche (tous les blocs restent visibles : aucun ne doit en cacher un autre)
function freeSpot(b, x, y, w, h){
  for (let rad = 0; rad <= 1000; rad += 8) {
    const c = [];
    for (let d = -rad; d <= rad; d += 8) c.push([x + d, y - rad], [x + d, y + rad], [x - rad, y + d], [x + rad, y + d]);
    c.sort((a, b2) => Math.hypot(a[0] - x, a[1] - y) - Math.hypot(b2[0] - x, b2[1] - y));
    for (const [cx, cy] of c) { const r = {x:cx, y:cy, w, h}; if (inside(r) && !overlapsAt(b, r)) return {x:cx, y:cy}; }
  }
  return null;
}
// taille d'un bloc : la plus grande vers la cible sans toucher un autre bloc (depuis une taille libre)
function growTo(b, x0, y0, from, to){
  const at = t => RS(b) ? fitSize(b, from.w + (to.w - from.w)*t, from.h + (to.h - from.h)*t) : {s:from.s + (to.s - from.s)*t};
  const rect = z => ({x:x0, y:y0, w:z.w ?? b.r[2]*z.s, h:z.h ?? b.r[3]*z.s});
  if (!overlapsAt(b, rect(at(1))) && inside(rect(at(1)))) return at(1);
  let lo = 0, hi = 1; for (let i = 0; i < 16; i++) { const m = (lo + hi)/2, r = rect(at(m)); if (overlapsAt(b, r) || !inside(r)) hi = m; else lo = m; }
  return at(lo);
}
const hidden = t => shown(t).filter(overlaps).length;

// ---------------------------------------------------------------------------------- vignettes
const sprImg = {};
function img(key){
  if (!sprImg[key]) { const i = new Image(); i.src = DATA.sprites[key]; i.onload = () => { recolorCache.clear(); dirty = true; }; sprImg[key] = i; }
  return sprImg[key];
}
const recolorCache = new Map();
function sprite(t){
  const base = lightBase() ? "alu" : "nothing";
  const a = accent(), key = base + "-" + t + "-" + toHex(a);
  if (recolorCache.has(key)) return recolorCache.get(key);
  const im = img(base + "-" + t), mk = img(base + "-" + t + "-acc");

// ---------------------------------------------------------------------------------- fond importé

  if (file && file.url) URL.revokeObjectURL(file.url);

  if (video) {
    const v = document.createElement("video"); v.src = url; v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
    await new Promise(r => { v.onloadedmetadata = r; v.onerror = r; }); v.play().catch(() => {});
    file.el = v; file.w = v.videoWidth; file.h = v.videoHeight; file.dur = v.duration || 0;
    if (!["mp4", "mov", "m4v"].includes(ext)) file.warn = "RAW 2 lit les vidéos MP4, MOV et M4V (AVI et WMV aussi sous Windows). Convertis ce fichier en MP4 (H.264).";
    else if (file.dur > 10.5) file.warn = "RAW 2 joue les 10 premières secondes en boucle (480 × 360, 12 images/s).";
    if (bytes.byteLength > 40e6) file.warn += (file.warn ? " " : "") + "Fichier lourd (" + (bytes.byteLength/1e6).toFixed(0) + " Mo) : le skin le sera aussi.";
  } else {

    file.el = i; file.w = i.naturalWidth; file.h = i.naturalHeight;
    if (!file.w) { toast("image illisible"); file = null; buildSide(); return; }
    if (ext === "heic") file.warn = "HEIC : lu par RAW 2 sur Mac seulement. Préfère JPG ou PNG pour Windows.";
  }
  S.bg.kind = "file"; dirty = true; save(); buildSide();
}

// ---------------------------------------------------------------------------------- export : GIF, PNG, ZIP

// GIF animé : palette adaptative (coupe médiane), tramage ordonné, LZW

const canvasBytes = (cv, type, q) => new Promise(r => cv.toBlob(b => b.arrayBuffer().then(a => r(new Uint8Array(a))), type, q));
async function backgroundFile(progress){
  if (S.bg.kind === "file" && file) {
    const ext = (file.name.split(".").pop() || "bin").toLowerCase();

    if (!file.video && ext !== "gif" && (file.bytes.byteLength > 3e6 || Math.max(file.w, file.h) > 2600)) {
      const k = Math.min(1, 2400 / Math.max(file.w, file.h)), cv = document.createElement("canvas");

function skinJson(bgName){

  return {format:"raw2skin", version:1, name:S.name.trim() || "Skin", author:S.author.trim(), base:S.base, colors,
    background:{file:bgName || "", voile:+S.bg.voile.toFixed(3), grille:S.bg.grille},
    glass:{on:S.glass.on, flou:+S.glass.flou.toFixed(3), teinte:+S.glass.teinte.toFixed(3), reflet:+S.glass.reflet.toFixed(3)},

async function exportSkin(){

    const bg = await backgroundFile(p => btn.textContent = "GIF " + Math.round(p*100) + " %");
    const entries = [{name:"skin.json", data:new TextEncoder().encode(JSON.stringify(skinJson(bg && bg.name), null, 2))}];
    if (bg) entries.push(bg);
    const fname = (S.name.trim() || "skin").replace(/[<>:"/\\|?*\x00-\x1f]/g, "") + ".raw2skin";
    const zip = zipStore(entries);
    // page publiée sur claude.ai : l'enregistrement passe par la plateforme, qui n'accepte que .zip
    // (RAW 2 lit aussi les skins .zip) ; fichier ouvert directement : téléchargement classique
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (dl) {
      try { await dl.save({filename:fname + ".zip", data:zip}); toast("enregistré · " + (zip.size/1e6).toFixed(1) + " Mo · glisse le .zip sur RAW 2"); }
      catch (e) { toast(e && e.code === "declined" ? "enregistrement annulé" : "enregistrement impossible ici (" + (e && e.code || "?") + ")"); }
    } else {
      const blob = new File([zip], fname, {type:"application/octet-stream"}), a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = fname;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("exporté · " + (blob.size/1e6).toFixed(1) + " Mo · glisse-le sur RAW 2");
    }

}

    S = DEF(); S.name = j.name || "Skin"; S.author = j.author || ""; if (DATA.themes[j.base]) S.base = j.base;
    S.colors = j.colors || {}; S.layout = j.layout || {}; S.hidden = Array.isArray(j.hidden) ? j.hidden.filter(k => typeof k === "string") : [];
    const bg = j.background || {}; S.bg.voile = bg.voile ?? 0.35; S.bg.grille = bg.grille ?? true;
    const gl = j.glass || {}; S.glass = {on:!!gl.on, flou:gl.flou ?? 0.6, teinte:gl.teinte ?? 0.35, reflet:gl.reflet ?? 0.6}; S.cards = (j.cards || {}).opacite ?? 0.85;
    file = null; S.bg.kind = "none";

  if (/\.(raw2skin|zip)$/i.test(f.name)) openSkin(f); else loadMedia(f); });

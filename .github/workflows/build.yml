name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl1-mesa-dev

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # No -G: CMake picks the newest Visual Studio on the runner (2022 or 2026)
        run: cmake -S . -B build -A x64

      - name: Configure (macOS, universal arm64 + x86_64)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Zips ready for the abrasion.dev catalog (Twisted-windows.zip / Twisted-macos.zip)
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/Twisted
          cp -R build/plugins/Twisted.clap build/plugins/Twisted.vst3 dist/Twisted/
          codesign --force --deep --sign - dist/Twisted/Twisted.clap
          codesign --force --deep --sign - dist/Twisted/Twisted.vst3
          lipo -info dist/Twisted/Twisted.vst3/Contents/MacOS/Twisted
          cp packaging/LISEZMOI-macos.txt dist/Twisted/LISEZMOI.txt
          cd dist && ditto -c -k --keepParent Twisted Twisted-macos.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist/Twisted | Out-Null
          Copy-Item -Recurse build/plugins/Twisted.clap, build/plugins/Twisted.vst3 dist/Twisted/
          Copy-Item packaging/LISEZMOI-windows.txt dist/Twisted/LISEZMOI.txt
          Compress-Archive -Path dist/Twisted -DestinationPath dist/Twisted-windows.zip

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: Twisted-${{ runner.os }}
          path: build/plugins

      - name: Upload site zip
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ runner.os }}
          path: dist/Twisted-*.zip
